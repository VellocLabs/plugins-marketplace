name: Rollback

# Redeploys a published release's site.zip verbatim. No checkout of the
# source, no stage: the bytes that were served are the bytes served again.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'The marketplace-<date>.<n> release to serve again'
        required: true

concurrency:
  group: marketplace-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern site.zip
          mkdir site && (cd site && unzip -q ../site.zip)
          test -f site/index.json && test -f site/marketplace.tar.gz && test -f site/wrangler.toml
          mv site/wrangler.toml wrangler.toml
          mkdir -p worker && mv site/worker/asset_gateway.mjs worker/ && rmdir site/worker
          echo "serving again: $(node -p "require('./site/index.json').buildId")"

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.120.0 deploy --config wrangler.toml
