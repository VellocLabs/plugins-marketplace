name: Deploy

# Publishes one build of the marketplace: check → stage → wrangler deploy →
# a GitHub Release carrying site.zip (what Rollback redeploys) and index.json.
# Manual trigger only; the origin has one current build.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source ref to publish (branch, tag or commit SHA)'
        required: true
        default: main
      note:
        description: 'What this build contains (free text, in the release notes)'
        required: false
        default: ''

concurrency:
  group: marketplace-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: node scripts/check_marketplace.mjs
      - run: node --test scripts/stage_site.test.mjs

      - name: Stage
        id: stage
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/stage_site.mjs . site
          echo "build_id=$(node -p "require('./site/index.json').buildId")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(node -p "require('./site/index.json').sha256")" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.120.0 deploy --config wrangler.toml

      - name: Verify the origin serves this build
        env:
          ORIGIN: https://plugins.velloc.app
          BUILD_ID: ${{ steps.stage.outputs.build_id }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            LIVE=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$ORIGIN/index.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).buildId" || echo '')
            if [ "$LIVE" = "$BUILD_ID" ]; then echo "origin serves $LIVE"; exit 0; fi
            echo "origin serves '${LIVE:-nothing}' (want $BUILD_ID), waiting…"; sleep 10
          done
          echo "::error::the origin never served $BUILD_ID"; exit 1

      - name: Pack the release artifact
        run: |
          set -euo pipefail
          cp wrangler.toml site/ && mkdir -p site/worker && cp worker/asset_gateway.mjs site/worker/
          (cd site && zip -qr ../site.zip .)
          rm site/wrangler.toml && rm -r site/worker

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE: ${{ inputs.note }}
          BUILD_ID: ${{ steps.stage.outputs.build_id }}
          SHA256: ${{ steps.stage.outputs.sha256 }}
        run: |
          set -euo pipefail
          DAY=$(date -u +%Y-%m-%d)
          N=1
          while gh release view "marketplace-$DAY.$N" >/dev/null 2>&1; do N=$((N+1)); done
          TAG="marketplace-$DAY.$N"
          gh release create "$TAG" site.zip site/index.json \
            --title "$TAG" \
            --notes "$(printf 'build %s\nsha256 %s\nsource %s\n\n%s' "$BUILD_ID" "$SHA256" "$GITHUB_SHA" "$NOTE")"
          echo "released $TAG"
